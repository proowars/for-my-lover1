<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#2d0f3a">
<meta name="robots" content="noindex, nofollow">
<title>Для тебя 💖</title>
<meta property="og:title" content="Для тебя 💖">
<meta property="og:description" content="Маленький сюрприз. Открой 💝">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💖</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Manrope:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#14081c; --bg2:#2d0f3a;
  --rose:#ff7eb3; --text:#fff1f6; --muted:#d9b8ca;
  --glass:rgba(255,255,255,.07); --line:rgba(255,255,255,.16);
  --r:22px;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{min-height:100%}
body{
  font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  color:var(--text);
  background:
    radial-gradient(1100px 700px at 12% -10%, #5c1a58 0%, transparent 60%),
    radial-gradient(900px 600px at 100% 100%, #7a2250 0%, transparent 55%),
    linear-gradient(160deg,var(--bg2),var(--bg1));
  background-attachment:fixed;
  overflow-x:hidden;
}
#bg,#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#bg{z-index:0}
#fx{z-index:80}
#app{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column;align-items:center;
  padding:max(18px,env(safe-area-inset-top)) 18px max(40px,env(safe-area-inset-bottom))}
.screen{width:100%;max-width:560px;animation:in .6s ease both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.12)}30%{transform:scale(1)}45%{transform:scale(1.08)}}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-10deg)}80%{transform:rotate(8deg)}}
@keyframes nope{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

h1,h2{font-family:'Playfair Display',Georgia,serif;font-weight:600}
h1{font-size:clamp(32px,9vw,42px);line-height:1.15}
h2{font-size:30px;line-height:1.15}
.hd{text-align:center;margin:8px 0 20px}
.sub{color:var(--muted);margin-top:6px;font-family:'Caveat',cursive;font-size:25px}
.quote{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:clamp(20px,5.2vw,26px);line-height:1.45}
.muted{color:var(--muted)}
.foot{text-align:center;margin:26px 0 6px;font-family:'Caveat',cursive;font-size:26px;color:var(--muted)}

.card{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:24px 22px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 20px 50px -25px rgba(0,0,0,.6)}
.card+.card{margin-top:14px}
.center{text-align:center}
.row{display:flex;justify-content:center;gap:10px;margin-top:20px;flex-wrap:wrap}
.pop{animation:pop .45s ease both}

.btn{font:inherit;font-weight:700;font-size:16px;color:#3a0f2b;background:linear-gradient(135deg,#ffc2d9,#ff7eb3);
  border:0;border-radius:999px;padding:14px 26px;cursor:pointer;
  box-shadow:0 10px 30px -10px rgba(255,90,150,.8);transition:transform .15s,box-shadow .2s}
.btn:not(.yes):not(.no):active{transform:scale(.96)}
.btn:hover{box-shadow:0 12px 34px -8px rgba(255,90,150,.95)}
.btn.ghost{background:var(--glass);color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn.big{font-size:18px;padding:16px 34px}

.top{display:flex;padding:4px 0 6px}
.back{background:none;border:0;color:var(--muted);font:inherit;font-size:15px;padding:8px 4px;cursor:pointer}
.back:hover{color:var(--text)}

/* intro */
.intro{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:16px;padding:20px 0}
.intro p{opacity:0;animation:fade 1.1s ease forwards;animation-delay:var(--d);font-size:clamp(18px,5vw,22px);line-height:1.5}
.intro p.hello{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:clamp(30px,9vw,42px)}
.intro .btn,.gate{opacity:0;animation:fade 1s ease forwards;animation-delay:var(--d);margin-top:10px}
.glowheart{font-size:64px;animation:beat 1.6s infinite;filter:drop-shadow(0 0 30px rgba(255,90,150,.8))}
.gate{display:flex;flex-direction:column;gap:12px;align-items:center;width:100%;max-width:340px}
.gate input{width:100%;font:inherit;font-size:17px;color:var(--text);text-align:center;background:var(--glass);
  border:1px solid var(--line);border-radius:999px;padding:14px 18px;outline:none}
.gate input:focus{border-color:var(--rose)}
.gate.bad{animation:nope .4s}
.hintp{color:var(--muted);font-size:14px;min-height:20px}

/* menu */
.daily small{display:block;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;font-size:11px;margin-bottom:10px;text-align:center}
.daily .quote{text-align:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.tile{font:inherit;color:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  padding:22px 10px;background:var(--glass);border:1px solid var(--line);border-radius:var(--r);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);cursor:pointer;
  animation:in .5s both;animation-delay:calc(var(--i) * 60ms);transition:transform .2s,border-color .2s,background .2s}
.tile:hover{transform:translateY(-3px);border-color:rgba(255,160,200,.55);background:rgba(255,255,255,.1)}
.tile:active{transform:scale(.97)}
.tile .em{font-size:36px}
.tile span:last-child{font-weight:600;font-size:15px}
.tile:last-child{grid-column:1/-1}

/* ball */
.ball{font-size:96px;background:none;border:0;cursor:pointer;filter:drop-shadow(0 10px 30px rgba(190,100,255,.6))}
.ball.shake{animation:shake .7s}

/* letters */
.stack{display:grid;gap:10px}
.env{display:flex;align-items:center;gap:14px;text-align:left;font:inherit;font-size:17px;color:inherit;padding:16px 18px;
  background:var(--glass);border:1px solid var(--line);border-radius:18px;cursor:pointer;transition:transform .2s,border-color .2s}
.env:hover{transform:translateX(4px);border-color:rgba(255,160,200,.55)}
.env .e{font-size:26px}
.paper{background:linear-gradient(160deg,#fff8ee,#ffe6d2);color:#4a2438;border-radius:6px;padding:26px 22px;
  box-shadow:0 24px 50px -15px rgba(0,0,0,.65);transform:rotate(-.6deg);font-family:'Caveat',cursive;font-size:26px;
  line-height:1.35;min-height:280px;animation:pop .5s both;cursor:pointer}
.paper .pl{font-weight:700;color:#b0366b;margin-bottom:12px}
.paper .pt{white-space:pre-wrap;min-height:130px}
.paper .sig{text-align:right;margin-top:14px;color:#b0366b}

/* quiz */
.opts{display:grid;gap:10px;margin-top:18px}
.opt{font:inherit;font-size:16px;font-weight:600;color:inherit;text-align:left;padding:14px 16px;background:rgba(255,255,255,.06);
  border:1px solid var(--line);border-radius:16px;cursor:pointer;transition:background .2s,border-color .2s,transform .15s}
.opt:hover{background:rgba(255,255,255,.11)}
.opt:active{transform:scale(.98)}
.opt.right{background:rgba(110,231,160,.22);border-color:#6ee7a0}
.opt.wrong{background:rgba(255,110,130,.2);border-color:#ff7a8a}
.fb{min-height:24px;margin-top:14px;text-align:center;font-weight:600}
.score{font-family:'Playfair Display',serif;font-size:64px;text-align:center;line-height:1}

/* together */
.units{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.unit{text-align:center;padding:14px 4px;border-radius:16px;background:rgba(255,255,255,.06)}
.unit b{display:block;font-family:'Playfair Display',serif;font-size:34px;font-variant-numeric:tabular-nums}
.unit span{font-size:12px;color:var(--muted)}
.fact{margin:6px 0;line-height:1.5}
.fact b{color:#ffc2d9}

/* photos */
.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ph{aspect-ratio:1;border:0;border-radius:18px;overflow:hidden;cursor:pointer;padding:0;display:grid;place-items:center;
  font-size:48px;box-shadow:0 12px 30px -14px rgba(0,0,0,.7);transition:transform .2s}
.ph:hover{transform:scale(1.03) rotate(-1deg)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
#lb{position:fixed;inset:0;z-index:100;background:rgba(10,3,16,.93);display:grid;grid-template-columns:auto 1fr auto;
  grid-template-rows:1fr auto;align-items:center;gap:8px;padding:18px}
#lb-body{display:grid;place-items:center;min-height:0;height:100%}
#lb-body img{max-width:100%;max-height:78vh;border-radius:14px}
.lb-ph{width:min(78vw,420px);aspect-ratio:1;border-radius:20px;display:grid;place-items:center;font-size:110px}
#lb-cap{grid-column:1/-1;text-align:center;font-family:'Caveat',cursive;font-size:28px;color:#ffd9e8;padding-bottom:10px}
.lb-nav,.lb-x{background:var(--glass);border:1px solid var(--line);color:#fff;border-radius:50%;width:44px;height:44px;font-size:24px;cursor:pointer}
.lb-x{position:absolute;top:14px;right:14px}

/* heart */
.heartzone{display:grid;place-items:center;height:340px;user-select:none;-webkit-user-select:none;touch-action:manipulation;cursor:pointer;position:relative}
.bigheart{width:min(60vw,250px);filter:drop-shadow(0 10px 40px rgba(255,70,140,.6));animation:beat 1.4s infinite}
#hmsg{margin-top:18px;min-height:64px}

/* ask */
.askzone{position:relative;height:230px;margin-top:6px}
.yes{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--s,1));transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.yes:active{transform:translate(-50%,-50%) scale(var(--s,1))}
.no{position:absolute;left:calc(50% + 80px);top:50%;transform:translateY(-50%);transition:left .28s ease,top .28s ease,opacity .4s;white-space:nowrap}
.no:active{transform:var(--nt,translateY(-50%))}

#music{position:fixed;right:16px;bottom:max(16px,env(safe-area-inset-bottom));z-index:60;width:46px;height:46px;border-radius:50%;
  border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);color:#fff;font-size:20px;cursor:pointer;opacity:.7}
#music.on{opacity:1;animation:beat 1.4s infinite}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="fx"></canvas>
<main id="app"></main>
<button id="music" hidden aria-label="Музыка">🎵</button>
<div id="lb" hidden>
  <button class="lb-x" aria-label="Закрыть">✕</button>
  <button class="lb-nav prev" aria-label="Назад">‹</button>
  <div id="lb-body"></div>
  <button class="lb-nav next" aria-label="Вперёд">›</button>
  <p id="lb-cap"></p>
</div>

<script>
(() => {
'use strict';

/* =====================================================================

const CONFIG = {

  // Викторина про вас. ЗАМЕНИ вопросы на настоящие! answer — номер правильного варианта (с нуля).

const $ = (s, r = document) => r.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const plural = (n, f) => { n = Math.abs(n); const a = n % 10, b = n % 100; return b > 10 && b < 20 ? f[2] : a > 1 && a < 5 ? f[1] : a === 1 ? f[0] : f[2]; };

const lastPick = {};
function pickIndex(list, key) {
  let i;
  do { i = Math.random() * list.length | 0; } while (list.length > 1 && i === lastPick[key]);
  lastPick[key] = i;
  return i;
}
const pick = (list, key) => list[pickIndex(list, key)];

/* ---------- эффекты: фон и взрывы сердечек ---------- */
const bg = $('#bg'), fx = $('#fx');
const bctx = bg.getContext('2d'), fctx = fx.getContext('2d');
let W = 0, H = 0;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  for (const c of [bg, fx]) { c.width = W * dpr; c.height = H * dpr; }
  bctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
addEventListener('resize', resize);

const GLYPHS = ['♥', '❤', '♡', '✦', '✧'];
const spawnFloater = init => ({
  x: Math.random() * W, y: init ? Math.random() * H : H + 20,
  s: 9 + Math.random() * 20, v: .25 + Math.random() * .6, a: .08 + Math.random() * .24,
  w: Math.random() * Math.PI * 2, g: GLYPHS[Math.random() * GLYPHS.length | 0],
});
const floaters = Array.from({ length: reduce ? 0 : 34 }, () => spawnFloater(true));
const parts = [];

function burst(x, y, n = 24, glyphs = ['💖', '💗', '💕', '❤️', '✨', '🌸']) {
  if (reduce) n = Math.ceil(n / 4);
  for (let i = 0; i < n; i++) {
    const ang = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 6;
    parts.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 3, life: 1,
      s: 16 + Math.random() * 18, g: glyphs[Math.random() * glyphs.length | 0] });
  }
}

function frame() {
  bctx.clearRect(0, 0, W, H);
  for (const f of floaters) {
    f.y -= f.v; f.w += .01; f.x += Math.sin(f.w) * .35;
    if (f.y < -30) Object.assign(f, spawnFloater(false));
    bctx.font = f.s + 'px serif';
    bctx.fillStyle = 'rgba(255,160,200,' + f.a + ')';
    bctx.fillText(f.g, f.x, f.y);
  }
  fctx.clearRect(0, 0, W, H);
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.vy += .18; p.x += p.vx; p.y += p.vy; p.vx *= .99; p.life -= .011;
    if (p.life <= 0) { parts.splice(i, 1); continue; }
    fctx.globalAlpha = p.life;
    fctx.font = p.s + 'px serif';
    fctx.fillText(p.g, p.x, p.y);
  }
  fctx.globalAlpha = 1;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// мелкие искорки на любое нажатие по кнопкам
document.addEventListener('pointerdown', e => {
  if (e.target.closest('.btn,.tile,.opt,.env,.ph')) burst(e.clientX, e.clientY, 6);
});

/* ---------- печатная машинка ---------- */
let typeId = 0;
async function typeInto(el, text, speed = 26) {
  const id = ++typeId;
  el.textContent = '';
  el.dataset.full = text;
  for (const ch of text) {
    if (id !== typeId) return;
    el.textContent += ch;
    await sleep(speed + (/[.…!?]/.test(ch) ? 160 : ch === ',' ? 70 : ch === '\n' ? 120 : 0));
  }
}

let audio = null;
const musicBtn = $('#music');
if (CONFIG.music) {
  audio = new Audio(CONFIG.music);
  audio.loop = true;
  musicBtn.hidden = false;
  musicBtn.onclick = () => {
    if (audio.paused) { audio.play().catch(() => {}); musicBtn.classList.add('on'); }
    else { audio.pause(); musicBtn.classList.remove('on'); }
  };
}
function startMusic() {
  if (audio && audio.paused) { audio.play().then(() => musicBtn.classList.add('on')).catch(() => {}); }
}

/* ---------- лайтбокс для фото ---------- */
const lb = $('#lb'), lbBody = $('#lb-body'), lbCap = $('#lb-cap');
let lbItems = [], lbI = 0;
function renderLB() {
  const it = lbItems[lbI];
  lbBody.innerHTML = it.src
    ? '<img src="' + esc(it.src) + '" alt="">'
    : '<div class="lb-ph" style="background:' + it.bg + '">' + it.emoji + '</div>';
  lbCap.textContent = it.caption || '';
}
function openLB(items, i) { lbItems = items; lbI = i; renderLB(); lb.hidden = false; }
function closeLB() { lb.hidden = true; }
lb.addEventListener('click', e => {
  if (e.target === lb || e.target.closest('.lb-x')) closeLB();
  else if (e.target.closest('.prev')) { lbI = (lbI - 1 + lbItems.length) % lbItems.length; renderLB(); }
  else if (e.target.closest('.next')) { lbI = (lbI + 1) % lbItems.length; renderLB(); }
});
addEventListener('keydown', e => {
  if (lb.hidden) return;
  if (e.key === 'Escape') closeLB();
  if (e.key === 'ArrowLeft') { lbI = (lbI - 1 + lbItems.length) % lbItems.length; renderLB(); }
  if (e.key === 'ArrowRight') { lbI = (lbI + 1) % lbItems.length; renderLB(); }
});

const wireBack = root => root.querySelectorAll('[data-back]').forEach(b => b.onclick = () => show('menu'));

function show(name, push = true) {
  if (cleanup) { cleanup(); cleanup = null; }
  typeId++;
  closeLB();
  const root = document.createElement('section');
  root.className = 'screen';
  app.replaceChildren(root);
  const c = (screens[name] || screens.menu)(root);

  wireBack(root);
  window.scrollTo(0, 0);
  if (push) { try { history.pushState({ name }, '', '#' + name); } catch (e) {} }
}

  const gated = !!(CONFIG.gate && CONFIG.gate.answer && String(CONFIG.gate.answer).length);

  root.innerHTML = '<div class="glowheart">💖</div>' + lines + (gated
    ? '<div class="gate" id="gate" style="--d:' + dEnd + 's"><p style="opacity:1;animation:none;font-size:17px">' + esc(CONFIG.gate.question) + '</p>' +
      '<input id="gi" autocomplete="off" autocapitalize="off" placeholder="Твой ответ…"><button class="btn" id="go">Войти 💝</button>' +
      '<p class="hintp" id="gh" style="opacity:1;animation:none;font-size:14px"></p></div>'
    : '<button class="btn big" id="go" style="--d:' + dEnd + 's">Открыть 💝</button>');

  const enter = (e) => {
    unlocked = true;
    if (e) burst(e.clientX || W / 2, e.clientY || H / 2, 30);
    startMusic();
    show('menu', false);
    try { history.replaceState({ name: 'menu' }, '', '#menu'); } catch (err) {}
  };
  const norm = s => String(s).trim().toLowerCase().replace(/\s+/g, ' ');
  $('#go', root).onclick = e => {
    if (!gated) return enter(e);
    const ok = [].concat(CONFIG.gate.answer).map(norm).includes(norm($('#gi', root).value));
    if (ok) return enter(e);
    const g = $('#gate', root);
    g.classList.remove('bad'); void g.offsetWidth; g.classList.add('bad');
    $('#gh', root).textContent = CONFIG.gate.hint || 'Попробуй ещё раз 🙈';
  };
  if (gated) $('#gi', root).addEventListener('keydown', e => { if (e.key === 'Enter') $('#go', root).click(); });
}

intro();
})();
</script>
</body>
</html>
